<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5f4131" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Curator" />
    <meta name="application-name" content="Curator" />
    <meta name="description" content="Offline-ready cataloging and valuation tool for antiques, ceramics, and fine art." />
    <title>Curator — Antiques & Collectibles Catalog</title>
  </head>
  <body class="bg-stone-50 dark:bg-stone-900 text-stone-900 dark:text-stone-100 min-h-screen font-sans antialiased selection:bg-amber-200 dark:selection:bg-amber-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Self-healing: if an asset fails to load, bust stale PWA caches and reload
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('Asset failed to load, clearing service worker cache...', e);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  for (var j = 0; j < keys.length; j++) { caches.delete(keys[j]); }
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            });
          }
        }
      }, true);

      // Timeout watchdog: If React root is still blank after 4s, provide recovery UI
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;text-align:center;background:#faf8f5;color:#292524">' +
            '<div style="width:48px;height:48px;border-radius:12px;background:#292524;color:#fef3c7;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;font-family:serif;margin-bottom:16px">C</div>' +
            '<h1 style="font-size:20px;font-weight:700;margin:0 0 8px;font-family:serif;color:#1c1917">Curator</h1>' +
            '<p style="color:#78716c;margin:0 0 24px;font-size:14px;max-width:320px;line-height:1.5">A new version was deployed. Tap below to reload the latest update.</p>' +
            '<button onclick="window.clearPwaAndReload()" style="background:#292524;color:#fef3c7;border:none;padding:12px 28px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.1)">Update & Reload</button>' +
            '</div>';
        }
      }, 4000);

      window.clearPwaAndReload = function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var j = 0; j < keys.length; j++) { caches.delete(keys[j]); }
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          });
        } else {
          window.location.reload();
        }
      };
    </script>
  </body>
</html>
